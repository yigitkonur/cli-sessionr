name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-flight runs when a new commit lands on main.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # tag + push CHANGELOG/package.json back
  issues: write         # semantic-release/github can comment on resolved issues
  pull-requests: write  # ditto for PRs
  id-token: write       # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository == 'yigitkonur/cli-sessionr'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0           # semantic-release needs full history + tags
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # actions/setup-node writes .npmrc with ${NODE_AUTH_TOKEN}, so the
          # npm CLI (used by @semantic-release/npm verifyConditions) needs this
          # env var set in addition to NPM_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx semantic-release
