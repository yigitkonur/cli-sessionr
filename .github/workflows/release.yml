name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-flight runs when a new commit lands on main.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # tag + push CHANGELOG/package.json back
  issues: write         # semantic-release/github can comment on resolved issues
  pull-requests: write  # ditto for PRs
  id-token: write       # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository == 'yigitkonur/cli-sessionr'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0           # semantic-release needs full history + tags
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # Node 22 ships npm 10.x, but npm's NATIVE OIDC trusted publishing
      # (used by `npm publish` under semantic-release) requires npm >= 11.5.1.
      # Without this, OIDC verifyConditions passes but the actual publish
      # fails with ENEEDAUTH. Upgrade the global npm so trusted publishing
      # works token-free.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN / NODE_AUTH_TOKEN on purpose: this package uses npm
          # Trusted Publishing (OIDC). If a token were present, setup-node
          # would write it into .npmrc and `npm publish` would prefer token
          # auth (which hits 2FA/EOTP on this account). With no token + npm
          # >= 11.5.1 + id-token:write, `npm publish` authenticates via OIDC
          # and emits provenance natively.
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx semantic-release
